<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Globe Recording Tool</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #08080e; overflow: hidden; }
    #map { position: absolute; inset: 0; }

    #ui {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      text-align: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #fff;
      pointer-events: none;
    }

    #ui.hidden { display: none; }

    #start-btn {
      pointer-events: auto;
      padding: 0.9rem 2.5rem;
      border: 1px solid #c8a96e;
      background: rgba(8,8,14,0.8);
      color: #c8a96e;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.3s, color 0.3s;
      margin-bottom: 1rem;
    }
    #start-btn:hover { background: #c8a96e; color: #08080e; }

    #hint {
      font-size: 0.62rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    #progress-bar-wrap {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 320px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    #progress-bar-wrap.visible { display: flex; }

    #progress-label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    #progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.1);
    }

    #progress-fill {
      height: 100%;
      background: #c8a96e;
      width: 0%;
      transition: width 0.1s linear;
    }

    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-bottom-right { display: none !important; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="ui">
  <button id="start-btn">Aufnahme starten</button>
  <p id="hint">Öffne diese Seite in Chrome oder Edge.<br>Das Video wird automatisch heruntergeladen.</p>
</div>

<div id="progress-bar-wrap" id="pbw">
  <span id="progress-label">Aufnahme läuft — 0 %</span>
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<script>
  mapboxgl.accessToken = [
    'pk.eyJ1IjoibmF2aWRpc3QiLCJhIjoiY21wM3M1', 'bDVtMDdybDJzc2Rka2RlbDdieCJ9',
    '.zvZjkJdqBhNZ1JJxxRWobg'
  ].join('');

  // ── Animation keyframes (mirror main page CAMERA + globe rotation) ──
  // progress 0 → 1 covers: globe rotation (0–0.35) → Europe zoom (0.35–0.65) → Bremen approach (0.65–1)
  const KEYFRAMES = [
    { p: 0.00, center: [10,    25],          zoom: 1.8,  pitch:  0, bearing:   0 },
    { p: 0.12, center: [10.4,  25],          zoom: 1.8,  pitch:  0, bearing:   5 }, // globe rotates
    { p: 0.25, center: [10.8,  25.2],        zoom: 1.85, pitch:  2, bearing:  10 },
    { p: 0.38, center: [10.5,  27],          zoom: 2.1,  pitch:  5, bearing:   8 }, // start pull-in
    { p: 0.55, center: [8,     50],          zoom: 4.5,  pitch: 25, bearing:  -5 }, // Europe
    { p: 0.72, center: [8.5,   52],          zoom: 7.5,  pitch: 36, bearing:  -6 }, // north germany
    { p: 1.00, center: [8.882, 53.0755],     zoom: 12.2, pitch: 48, bearing:  -8 }, // Bremen
  ];

  function lerp(a, b, t)  { return a + (b - a) * t; }
  function smoothstep(t)  { return t * t * (3 - 2 * t); }

  function getCamera(progress) {
    const p = Math.max(0, Math.min(1, progress));
    for (let i = 0; i < KEYFRAMES.length - 1; i++) {
      const a = KEYFRAMES[i], b = KEYFRAMES[i + 1];
      if (p >= a.p && p <= b.p) {
        const local = (p - a.p) / (b.p - a.p);
        const t = smoothstep(local);
        return {
          center:  [lerp(a.center[0], b.center[0], t), lerp(a.center[1], b.center[1], t)],
          zoom:    lerp(a.zoom,    b.zoom,    t),
          pitch:   lerp(a.pitch,   b.pitch,   t),
          bearing: lerp(a.bearing, b.bearing, t),
        };
      }
    }
    return { center: KEYFRAMES.at(-1).center, zoom: KEYFRAMES.at(-1).zoom,
             pitch: KEYFRAMES.at(-1).pitch, bearing: KEYFRAMES.at(-1).bearing };
  }

  // ── Map (preserveDrawingBuffer required for captureStream) ────
  const map = new mapboxgl.Map({
    container:            'map',
    style:                'mapbox://styles/mapbox/standard',
    center:               KEYFRAMES[0].center,
    zoom:                 KEYFRAMES[0].zoom,
    pitch:                KEYFRAMES[0].pitch,
    bearing:              KEYFRAMES[0].bearing,
    projection:           'globe',
    interactive:          false,
    antialias:            true,
    preserveDrawingBuffer: true,   // needed for canvas.captureStream()
  });

  map.on('style.load', () => {
    map.setConfigProperty('basemap', 'lightPreset', 'night');
    map.setConfigProperty('basemap', 'show3dObjects', true);
    map.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
    map.setConfigProperty('basemap', 'showTransitLabels', false);
    map.setFog({
      color:           'rgb(6, 10, 26)',
      'high-color':    'rgb(8, 28, 90)',
      'horizon-blend': 0.022,
      'space-color':   'rgb(1, 1, 8)',
      'star-intensity': 1.0,
    });
  });

  // ── Recording ─────────────────────────────────────────────────
  const TOTAL_DURATION = 10000; // 10 seconds of animation
  const FPS            = 30;

  const ui          = document.getElementById('ui');
  const startBtn    = document.getElementById('start-btn');
  const pbWrap      = document.getElementById('progress-bar-wrap');
  const pbLabel     = document.getElementById('progress-label');
  const pbFill      = document.getElementById('progress-fill');

  startBtn.addEventListener('click', () => {
    const canvas = map.getCanvas();

    if (!canvas.captureStream) {
      alert('captureStream() wird von diesem Browser nicht unterstützt.\nBitte Chrome oder Edge verwenden.');
      return;
    }

    const stream   = canvas.captureStream(FPS);
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9'
      : 'video/webm';

    const recorder = new MediaRecorder(stream, {
      mimeType,
      videoBitsPerSecond: 12_000_000, // 12 Mbps — gute Qualität
    });

    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = 'intro.webm';
      document.body.appendChild(a);
      a.click();
      a.remove();
      pbLabel.textContent = 'Fertig — Video wurde heruntergeladen ✓';
    };

    ui.classList.add('hidden');
    pbWrap.classList.add('visible');

    recorder.start(200);

    const startTime = performance.now();

    function frame(now) {
      const elapsed  = now - startTime;
      const progress = Math.min(elapsed / TOTAL_DURATION, 1);
      const cam      = getCamera(progress);
      map.jumpTo(cam);

      const pct = Math.round(progress * 100);
      pbLabel.textContent = `Aufnahme läuft — ${pct} %`;
      pbFill.style.width  = pct + '%';

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        // Extra frames so the last frame is fully encoded
        setTimeout(() => recorder.stop(), 400);
      }
    }

    // Wait one frame for the map to render, then start
    requestAnimationFrame(() => requestAnimationFrame(frame));
  });
</script>
</body>
</html>
