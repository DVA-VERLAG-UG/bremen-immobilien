<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Map Capture Harness</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #08080e; overflow: hidden; }
    #map { position: absolute; inset: 0; }
    #hud {
      position: fixed; bottom: 12px; left: 12px;
      background: rgba(0,0,0,0.75); color: #c8a96e;
      font: 13px/1.6 monospace; padding: 8px 14px; border-radius: 4px;
      z-index: 99; white-space: pre;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">initializing…</div>

  <script>
    // ── Config ───────────────────────────────────────────────────────────────
    const TOTAL_FRAMES = 120;
    const SET          = new URLSearchParams(location.search).get('set') || 'desktop';
    const IS_MOBILE    = SET === 'mobile';
    const W            = window.innerWidth;
    const H            = window.innerHeight;

    // ── Camera waypoints — exakte Kopie aus production (steps 1–3) ──────────
    const CAMERA = [
      { center: [8, 50],                            zoom: 4.5,                     pitch: 25,                  bearing: -5 },
      { center: [8.882, 53.0755],                   zoom: IS_MOBILE ? 11.0 : 12.2, pitch: IS_MOBILE ? 35 : 48, bearing: -8 },
      { center: [8.871257448102298, 53.09093],       zoom: IS_MOBILE ? 17.2 : 18.2, pitch: IS_MOBILE ? 48 : 55, bearing: 12 },
    ];

    function stepPadding(idx) {
      if (idx !== 2) return { left: 0, right: 0, top: 0, bottom: 0 };
      return IS_MOBILE
        ? { left: 0, right: 0, top: 0, bottom: Math.round(H * 0.45) }
        : { left: Math.min(500, Math.round(W * 0.42)), right: 0, top: 0, bottom: 310 };
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function smoothstep(t)  { return t * t * (3 - 2 * t); }

    function cameraAtFrame(n) {
      const progress = n / (TOTAL_FRAMES - 1);
      const raw      = progress * (CAMERA.length - 1);
      const fi       = Math.min(Math.floor(raw), CAMERA.length - 2);
      const ti       = fi + 1;
      const t        = smoothstep(Math.max(0, Math.min(1, raw - fi)));
      const fp       = stepPadding(fi);
      const tp       = stepPadding(ti);
      return {
        center:  [lerp(CAMERA[fi].center[0], CAMERA[ti].center[0], t),
                  lerp(CAMERA[fi].center[1], CAMERA[ti].center[1], t)],
        zoom:    lerp(CAMERA[fi].zoom,    CAMERA[ti].zoom,    t),
        pitch:   lerp(CAMERA[fi].pitch,   CAMERA[ti].pitch,   t),
        bearing: lerp(CAMERA[fi].bearing, CAMERA[ti].bearing, t),
        padding: {
          left:   lerp(fp.left,   tp.left,   t),
          right:  lerp(fp.right,  tp.right,  t),
          top:    lerp(fp.top,    tp.top,    t),
          bottom: lerp(fp.bottom, tp.bottom, t),
        },
      };
    }

    // ── Mapbox — KEIN preserveDrawingBuffer, da wir page.screenshot() nutzen ─
    mapboxgl.accessToken = [
      'pk.eyJ1IjoibmF2aWRpc3QiLCJhIjoiY21wM3M1',
      'bDVtMDdybDJzc2Rka2RlbDdieCJ9',
      '.zvZjkJdqBhNZ1JJxxRWobg'
    ].join('');

    const map = new mapboxgl.Map({
      container:    'map',
      style:        'mapbox://styles/mapbox/standard',
      projection:   'globe',
      interactive:  false,
      antialias:    true,
      fadeDuration: 0,
      ...cameraAtFrame(0),
    });

    const hud = document.getElementById('hud');

    // ── Frame-Protokoll — gelesen/geschrieben vom Puppeteer-Script ───────────
    window._frameReady  = false;
    window._captureDone = false;
    window._nextFrame   = null;

    let frameIndex = 0;

    function markReady() {
      hud.textContent = `set    : ${SET}\nframe  : ${frameIndex} / ${TOTAL_FRAMES - 1}\nstatus : ready ✓`;
      window._frameReady = true;
    }

    function goNextFrame() {
      frameIndex++;
      if (frameIndex >= TOTAL_FRAMES) {
        hud.textContent = `set    : ${SET}\nDONE — ${TOTAL_FRAMES} frames`;
        window._captureDone = true;
        return;
      }
      window._frameReady = false;
      hud.textContent = `set    : ${SET}\nframe  : ${frameIndex} / ${TOTAL_FRAMES - 1}\nstatus : loading…`;
      map.jumpTo(cameraAtFrame(frameIndex));
      // Zwei rAF-Ticks nach 'idle' damit der Compositor den finalen Frame
      // sicher gezeichnet hat, bevor Puppeteer den Screenshot macht.
      map.once('idle', () =>
        requestAnimationFrame(() =>
          requestAnimationFrame(markReady)
        )
      );
    }

    window._nextFrame = goNextFrame;

    map.on('style.load', () => {
      map.setConfigProperty('basemap', 'lightPreset',               'night');
      map.setConfigProperty('basemap', 'show3dObjects',             true);
      map.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
      map.setConfigProperty('basemap', 'showTransitLabels',         false);
      map.setFog({
        'color':          'rgb(6, 10, 26)',
        'high-color':     'rgb(8, 28, 90)',
        'horizon-blend':  0.022,
        'space-color':    'rgb(1, 1, 8)',
        'star-intensity': 1.0,
      });
      map.jumpTo(cameraAtFrame(0));
      map.once('idle', () =>
        requestAnimationFrame(() =>
          requestAnimationFrame(markReady)
        )
      );
    });
  </script>
</body>
</html>
